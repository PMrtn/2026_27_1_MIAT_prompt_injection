[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pidefense"
version = "0.1.0"
description = "ML-based prompt injection defense for MCP tool-using LLM agents (MSc Data Science project)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Martin Pintér" }]
# Exact, tested pins live in requirements.txt; these are the minimum compatible versions.
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "datasets>=4.0",
    "accelerate>=1.0",
    "safetensors>=0.5",
    "scikit-learn>=1.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "mcp>=2.3,<3",
    "openai>=3.0",
    "azure-identity>=1.19",
    "faker>=30.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "black>=24.0", "isort>=5.13", "pylint>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests"]

[tool.pylint.main]
max-line-length = 120
ignore-paths = ["^docs/.*"]

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-return-statements",
    "too-many-branches",
    "duplicate-code",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
